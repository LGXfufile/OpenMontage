name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test

  backlot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hosted Backlot dependencies
        run: python -m pip install -r api/requirements.txt httpx
      - name: Verify hosted application
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.index import app

          client = TestClient(app)
          assert client.get("/api/health").json() == {"ok": True, "app": "backlot"}
          projects = client.get("/api/projects").json()
          assert any(project["project_id"] == "openmontage-demo" for project in projects)
          PY

  remotion-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion-composer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json
      - run: npm ci
